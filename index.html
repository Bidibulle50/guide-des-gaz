<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Un guide indépendant des gaz industriels : propriétés sourcées, risques et applications. Consultable hors ligne.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Guide des gaz">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Guide des gaz</title>
  <link rel="icon" href="./icons/favicon-cobalt-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./icons/apple-touch-cobalt-180.png" sizes="180x180">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="./theme.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="nav-filter-defs" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="navigation-ink" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <feColorMatrix in="SourceGraphic" type="luminanceToAlpha"/>
        <feComponentTransfer result="ink"><feFuncA type="linear" slope="4" intercept="-0.5"/></feComponentTransfer>
        <feFlood class="nav-ink-colour" result="colour"/>
        <feComposite in="colour" in2="ink" operator="in"/>
      </filter>
    </defs>
  </svg>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <main id="main" tabindex="-1"><p class="loading">Chargement du guide…</p></main>
  <noscript>Activez JavaScript pour consulter les fiches et utiliser le mode hors ligne.</noscript>
  <aside class="connection" aria-live="polite" id="connection">Préparation du mode hors ligne…</aside>
  <nav class="bottom-nav" aria-label="Navigation principale"></nav>
  <div id="toast" role="status" class="toast" hidden></div>
  <aside id="update" class="update" hidden><span>Une nouvelle édition est disponible.</span><button id="apply-update">Actualiser</button></aside>
</body>
</html>
